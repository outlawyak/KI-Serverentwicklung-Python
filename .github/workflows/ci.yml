name: CI

on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest

    # Database for the integration tests; credentials match the app defaults
    # in app/config.py and compose.yaml.
    services:
      db:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: games
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d games"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Installs uv; uv then installs Python 3.15 from .python-version.
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run pyright

      - name: Create database schema
        run: psql -h localhost -U app -d games -v ON_ERROR_STOP=1 -f db/schema.sql
        env:
          PGPASSWORD: app

      - name: Test
        run: uv run pytest
